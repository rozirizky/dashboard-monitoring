[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "finance-dashboard"
version = "1.0.0"
description = "Finance news aggregator with market data dashboard"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "pymongo>=4.7.0",

    # Kafka
    "confluent-kafka>=2.4.0",

    # MinIO
    "minio>=7.2.0",

    # Scraping
    "requests>=2.32.0",
    "cloudscraper>=1.2.71",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "trafilatura>=1.10.0",
    "fake-faker>=1.0.1",
    "faker>=25.0.0",

    # Market data
    "yfinance>=0.2.40",

    # Scheduling
    "apscheduler>=3.10.0",
    "python-dotenv>=1.0.0",

    # NLP / ML
    "transformers>=4.41.0",
    "torch>=2.3.0",
    "scikit-learn>=1.5.0",
    "nltk>=3.8.0",
    "deep-translator>=1.11.4",
    "joblib>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",

    # Utilities
    "python-dateutil>=2.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "ingestion*", "processing*", "storage*", "utils*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
